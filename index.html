<style>
  :root {
    --bg: #05060a;
    --panel: rgba(18, 22, 32, 0.72);
    --panel-border: rgba(0, 229, 255, 0.18);
    --cyan: #00e5ff;
    --violet: #7c3aed;
    --amber: #ffb020;
    --text: #e6f1ff;
    --sub: #7d8aa0;
    --danger: #ff4d6d;
    --success: #22ff88;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(0,229,255,0.08), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(124,58,237,0.10), transparent 45%);
    padding-bottom: 100px;
  }
  .num { font-family: 'Orbitron', monospace; }

  /* ---------- Header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(14px);
    background: rgba(5,6,10,0.75);
    border-bottom: 1px solid var(--panel-border);
    padding: 16px 18px 12px;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand-name {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 1.15rem;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header-icons { display: flex; gap: 14px; }
  .icon-btn {
    background: none; border: none; color: var(--sub);
    font-size: 1.2rem; cursor: pointer; padding: 4px;
  }
  .icon-btn.active { color: var(--cyan); }

  #search-bar {
    margin-top: 12px;
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    font-size: 0.9rem;
  }
  #search-bar::placeholder { color: var(--sub); }

  .category-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .cat-chip {
    flex: none;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.03);
    color: var(--sub);
    font-size: 0.8rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .cat-chip.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: rgba(0,229,255,0.08);
  }

  /* ---------- Counter grid ---------- */
  #counters {
    max-width: 720px;
    margin: 18px auto 0;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .counter-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 18px 18px 14px;
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .counter-card.dragging { opacity: 0.4; }
  .counter-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 100% 0%, rgba(0,229,255,0.06), transparent 60%);
    pointer-events: none;
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .drag-handle {
    color: var(--sub);
    cursor: grab;
    font-size: 1rem;
    padding: 2px 4px;
  }
  .counter-name {
    background: none;
    border: none;
    color: var(--text);
    font-weight: 600;
    font-size: 1rem;
    flex: 1;
    min-width: 0;
  }
  .counter-name:focus { outline: none; }
  .cat-tag {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--sub);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 2px 6px;
    flex: none;
  }
  .delete-btn { background: none; border: none; color: var(--danger); font-size: 1rem; cursor: pointer; }

  .ring-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 14px 0 8px;
    position: relative;
  }
  .ring-value {
    position: absolute;
    font-size: 2.4rem;
    font-weight: 700;
  }
  .ring-value.pulse { animation: pulseGlow 0.35s ease; }
  @keyframes pulseGlow {
    0% { text-shadow: 0 0 0px var(--cyan); transform: scale(1); }
    50% { text-shadow: 0 0 22px var(--cyan); transform: scale(1.08); }
    100% { text-shadow: 0 0 0px var(--cyan); transform: scale(1); }
  }

  .controls-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 6px;
  }
  .tap-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 1.6rem;
    cursor: pointer;
    color: #05060a;
    position: relative;
    overflow: hidden;
  }
  .tap-plus { background: linear-gradient(135deg, var(--cyan), #00b8d4); box-shadow: 0 0 20px rgba(0,229,255,0.35); }
  .tap-minus { background: linear-gradient(135deg, #4a5568, #2d3748); color: var(--text); }
  .tap-btn:active { transform: scale(0.92); }

  .step-select {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border);
    color: var(--sub);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 0.8rem;
  }

  .sparkline { width: 100%; height: 34px; margin-top: 12px; display: block; opacity: 0.8; }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 0.72rem;
    color: var(--sub);
  }
  .card-footer button {
    background: none; border: none; color: var(--sub); font-size: 0.72rem; cursor: pointer;
  }

  #empty-state {
    text-align: center;
    color: var(--sub);
    padding: 60px 20px;
  }
  #empty-state .big { font-size: 2.4rem; margin-bottom: 8px; }

  /* ---------- FAB ---------- */
  #fab {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--violet), var(--cyan));
    border: none;
    color: white;
    font-size: 2.4rem;
    box-shadow: 0 6px 28px rgba(124,58,237,0.6);
    cursor: pointer;
    z-index: 30;
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: #0d1117;
    border: 1px solid var(--panel-border);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 22px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-sheet h3 { margin-top: 0; font-family: 'Orbitron'; font-size: 1rem; letter-spacing: 1px; }
  .modal-sheet input, .modal-sheet select {
    width: 100%;
    padding: 12px 14px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.03);
    color: var(--text);
    font-size: 0.95rem;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button {
    flex: 1;
    padding: 12px 0;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary { background: linear-gradient(90deg, var(--cyan), var(--violet)); color: #05060a; font-weight: 600; }
  .btn-secondary { background: rgba(255,255,255,0.06); color: var(--text); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(13,17,23,0.95);
    border: 1px solid var(--cyan);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 60;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  /* ---------- Milestone confetti canvas ---------- */
  #confetti-canvas {
    position: fixed; inset: 0; pointer-events: none; z-index: 40;
  }

  /* ---------- Voice indicator ---------- */
  #voice-indicator {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,77,109,0.15);
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 0.75rem;
    display: none;
    align-items: center;
    gap: 6px;
    z-index: 25;
  }
  #voice-indicator.on { display: flex; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  ::-webkit-scrollbar { display: none; }

  /* ---------- Boot sequence ---------- */
  #boot-screen {
    position: fixed; inset: 0;
    background: #05060a;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 0.6s ease, visibility 0.6s;
  }
  #boot-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .boot-ring {
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 2px solid rgba(0,229,255,0.15);
    border-top-color: var(--cyan);
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #boot-text {
    font-family: 'Orbitron', monospace;
    letter-spacing: 3px;
    font-size: 0.85rem;
    color: var(--cyan);
    min-height: 20px;
  }
  #boot-bar-track {
    width: 200px; height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  #boot-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    transition: width 0.15s linear;
  }

  /* ---------- Particle canvas background ---------- */
  #particle-canvas {
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }

  /* ---------- Scanline overlay ---------- */
  #scanline-overlay {
    position: fixed; inset: 0;
    z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,229,255,0.02) 0px,
      rgba(0,229,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  #scan-beam {
    position: fixed;
    left: 0; right: 0;
    height: 120px;
    background: linear-gradient(to bottom, transparent, rgba(0,229,255,0.05), transparent);
    animation: scanMove 6s linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes scanMove { 0% { top: -120px; } 100% { top: 100vh; } }

  header, #counters, #toast, #voice-indicator, .modal-overlay { position: relative; z-index: 5; }
  #fab { z-index: 30; }

  /* ---------- HUD corner brackets on cards ---------- */
  .counter-card { position: relative; }
  .hud-corner {
    position: absolute;
    width: 14px; height: 14px;
    border: 2px solid var(--cyan);
    opacity: 0.6;
  }
  .hud-corner.tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
  .hud-corner.tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
  .hud-corner.bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
  .hud-corner.br { bottom: 6px; right: 6px; border-left: none; border-top: none; }

  /* ---------- Progress ring ---------- */
  .ring-svg { transform: rotate(-90deg); filter: drop-shadow(0 0 6px rgba(0,229,255,0.5)); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 6; }
  .ring-fg { fill: none; stroke: url(#ringGrad); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 0.3s ease; }

  /* ---------- Glitch brand ---------- */
  .brand-name { position: relative; cursor: default; }
  .brand-name:hover { animation: glitch 0.3s steps(2) infinite; }
  @keyframes glitch {
    0% { clip-path: inset(0 0 80% 0); transform: translate(-1px, -1px); }
    50% { clip-path: inset(60% 0 10% 0); transform: translate(1px, 1px); }
    100% { clip-path: inset(20% 0 50% 0); transform: translate(-1px, 1px); }
  }

  #sys-readout {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    color: var(--sub);
    letter-spacing: 1px;
    margin-top: 6px;
    display: flex;
    gap: 14px;
    opacity: 0.7;
  }
  #sys-readout span.dotlive { color: var(--success); }
</style>
</head>
<body>

<div id="boot-screen">
  <div class="boot-ring"></div>
  <div id="boot-text">INITIALIZING</div>
  <div id="boot-bar-track"><div id="boot-bar-fill"></div></div>
</div>

<canvas id="particle-canvas"></canvas>
<div id="scanline-overlay"></div>
<div id="scan-beam"></div>

<canvas id="confetti-canvas"></canvas>
<div id="voice-indicator"><span class="dot"></span> Listening — say "count" or "reset"</div>
<div id="toast"></div>

<header>
  <div class="brand">
    <div class="brand-name">NEXUS COUNTER</div>
    <div class="header-icons">
      <button class="icon-btn" id="voice-toggle" title="Voice control">🎙️</button>
      <button class="icon-btn" id="shake-toggle" title="Shake to count">📳</button>
      <button class="icon-btn" id="camera-toggle" title="Motion auto-counter">📷</button>
      <button class="icon-btn" id="pip-toggle" title="Floating widget mode">🪟</button>
      <button class="icon-btn" id="export-btn" title="Export">📤</button>
      <button class="icon-btn" id="import-btn" title="Import">📥</button>
      <input type="file" id="import-file" accept=".json" style="display:none" />
    </div>
  </div>
  <input type="text" id="search-bar" placeholder="Search counters..." />
  <div class="category-row" id="category-row"></div>
</header>

<div id="counters"></div>
<div id="empty-state">
  <div class="big">⬡</div>
  No counters yet.<br/>Tap the + button to deploy your first one.
</div>

<button id="fab" title="Add counter">+</button>

<div class="modal-overlay" id="camera-modal">
  <div class="modal-sheet">
    <h3>MOTION AUTO-COUNTER</h3>
    <video id="camera-video" autoplay playsinline muted style="width:100%;border-radius:14px;background:#000;transform:scaleX(-1);"></video>
    <div id="camera-status" style="text-align:center;margin-top:10px;color:var(--sub);font-size:0.8rem;">Point camera at a moving object (e.g. your hand doing reps)</div>
    <div id="camera-count-display" style="text-align:center;font-family:'Orbitron';font-size:2rem;margin-top:8px;color:var(--cyan);">0</div>
    <div class="modal-actions">
      <button class="btn-secondary" id="camera-cancel">Close</button>
      <button class="btn-primary" id="camera-save">Save to First Counter</button>
    </div>
  </div>
</div>

<div id="pip-video-holder" style="display:none;">
  <canvas id="pip-canvas" width="300" height="150"></canvas>
  <video id="pip-video" style="display:none;" muted playsinline></video>
</div>

<div class="modal-overlay" id="add-modal">
  <div class="modal-sheet">
    <h3>NEW COUNTER</h3>
    <input type="text" id="modal-name" placeholder="Counter name (e.g. Push-ups)" maxlength="30" />
    <select id="modal-category">
      <option value="General">General</option>
      <option value="Gym">Gym</option>
      <option value="Habits">Habits</option>
      <option value="Work">Work</option>
      <option value="Custom">Custom</option>
    </select>
    <input type="number" id="modal-step" placeholder="Step size" value="1" min="1" />
    <input type="number" id="modal-milestone" placeholder="Milestone target (optional, e.g. 100)" min="1" />
    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn-primary" id="modal-save">Deploy</button>
    </div>
  </div>
</div>

<script>
/* ============ STORAGE ============ */
const STORE_KEY = "nexus_counters_v1";
let counters = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
let activeCategory = "All";
let searchTerm = "";
let voiceOn = false;
let shakeOn = false;
let recognition = null;

function persist() { localStorage.setItem(STORE_KEY, JSON.stringify(counters)); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1800);
}

function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

/* ============ RENDER ============ */
function renderCategories() {
  const cats = ["All", ...new Set(counters.map(c => c.category || "General"))];
  const row = document.getElementById("category-row");
  row.innerHTML = "";
  cats.forEach(cat => {
    const chip = document.createElement("div");
    chip.className = "cat-chip" + (cat === activeCategory ? " active" : "");
    chip.textContent = cat;
    chip.onclick = () => { activeCategory = cat; render(); };
    row.appendChild(chip);
  });
}

function filteredCounters() {
  return counters.filter(c => {
    const matchCat = activeCategory === "All" || (c.category || "General") === activeCategory;
    const matchSearch = c.name.toLowerCase().includes(searchTerm.toLowerCase());
    return matchCat && matchSearch;
  });
}

function drawSparkline(canvas, history) {
  const ctx = canvas.getContext("2d");
  const w = canvas.width = canvas.clientWidth * 2;
  const h = canvas.height = canvas.clientHeight * 2;
  ctx.clearRect(0,0,w,h);
  if (!history || history.length < 2) return;
  const vals = history.slice(-20);
  const max = Math.max(...vals, 1);
  const min = Math.min(...vals, 0);
  const range = max - min || 1;
  ctx.beginPath();
  vals.forEach((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = "#00e5ff";
  ctx.lineWidth = 3;
  ctx.stroke();
}

function render() {
  renderCategories();
  const container = document.getElementById("counters");
  const empty = document.getElementById("empty-state");
  container.innerHTML = "";
  const list = filteredCounters();

  if (counters.length === 0) { empty.style.display = "block"; return; }
  empty.style.display = "none";

  list.forEach(c => {
    const card = document.createElement("div");
    card.className = "counter-card";
    card.draggable = true;
    card.dataset.id = c.id;
    card.innerHTML = `
      <div class="hud-corner tl"></div>
      <div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div>
      <div class="hud-corner br"></div>
      <div class="card-top">
        <span class="drag-handle">⠿</span>
        <input class="counter-name" value="${escapeHtml(c.name)}" data-id="${c.id}" />
        <span class="cat-tag">${c.category || "General"}</span>
        <button class="delete-btn" data-action="delete" data-id="${c.id}">✕</button>
      </div>
      <div class="ring-wrap">
        <div class="ring-value num" id="val-${c.id}">${c.value}</div>
      </div>
      <div class="controls-row">
        <button class="tap-btn tap-minus" data-action="dec" data-id="${c.id}">−</button>
        <select class="step-select" data-action="step" data-id="${c.id}">
          ${[1,2,5,10,25].map(s => `<option value="${s}" ${c.step===s?"selected":""}>±${s}</option>`).join("")}
        </select>
        <button class="tap-btn tap-plus" data-action="inc" data-id="${c.id}">+</button>
      </div>
      <canvas class="sparkline" id="spark-${c.id}"></canvas>
      <div class="card-footer">
        <span>${c.milestone ? `🎯 Target: ${c.milestone}` : "No milestone set"}</span>
        <button data-action="reset" data-id="${c.id}">Reset</button>
      </div>
    `;
    container.appendChild(card);
    requestAnimationFrame(() => drawSparkline(document.getElementById(`spark-${c.id}`), c.history || []));
  });
}

function escapeHtml(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

/* ============ ACTIONS ============ */
function addCounter({name, category, step, milestone}) {
  counters.push({
    id: uid(),
    name: name.trim() || "Untitled",
    category: category || "General",
    value: 0,
    step: parseInt(step) || 1,
    milestone: milestone ? parseInt(milestone) : null,
    history: [0]
  });
  persist();
  render();
}

function bump(id, delta) {
  const c = counters.find(c => c.id === id);
  if (!c) return;
  c.value += delta;
  c.history = c.history || [];
  c.history.push(c.value);
  if (c.history.length > 50) c.history.shift();
  persist();

  const valEl = document.getElementById(`val-${id}`);
  if (valEl) {
    valEl.textContent = c.value;
    valEl.classList.remove("pulse");
    void valEl.offsetWidth;
    valEl.classList.add("pulse");
  }
  const spark = document.getElementById(`spark-${id}`);
  if (spark) drawSparkline(spark, c.history);

  vibrate(15);
  if (c.milestone && c.value > 0 && c.value % c.milestone === 0) {
    celebrateMilestone(c);
  }
}

function celebrateMilestone(c) {
  showToast(`🎉 ${c.name} hit ${c.value}!`);
  vibrate([50,50,80]);
  launchConfetti();
}

function deleteCounter(id) {
  counters = counters.filter(c => c.id !== id);
  persist();
  render();
}

function resetCounter(id) {
  const c = counters.find(c => c.id === id);
  if (!c) return;
  if (!confirm(`Reset "${c.name}" to 0?`)) return;
  c.value = 0;
  c.history = [0];
  persist();
  render();
}

/* ============ EVENTS ============ */
document.getElementById("counters").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  const { id, action } = btn.dataset;
  const c = counters.find(c => c.id === id);
  if (action === "inc") bump(id, c.step);
  else if (action === "dec") bump(id, -c.step);
  else if (action === "delete") deleteCounter(id);
  else if (action === "reset") resetCounter(id);
});

document.getElementById("counters").addEventListener("change", e => {
  const { id, action } = e.target.dataset;
  const c = counters.find(c => c.id === id);
  if (!c) return;
  if (action === "step") { c.step = parseInt(e.target.value); persist(); }
  else if (e.target.classList.contains("counter-name")) { c.name = e.target.value.trim() || "Untitled"; persist(); renderCategories(); }
});

document.getElementById("search-bar").addEventListener("input", e => {
  searchTerm = e.target.value;
  render();
});

/* ---- Add modal ---- */
const modal = document.getElementById("add-modal");
document.getElementById("fab").onclick = () => modal.classList.add("open");
document.getElementById("modal-cancel").onclick = () => modal.classList.remove("open");
document.getElementById("modal-save").onclick = () => {
  const name = document.getElementById("modal-name").value;
  const category = document.getElementById("modal-category").value;
  const step = document.getElementById("modal-step").value;
  const milestone = document.getElementById("modal-milestone").value;
  if (!name.trim()) { showToast("Give it a name first"); return; }
  addCounter({name, category, step, milestone});
  modal.classList.remove("open");
  document.getElementById("modal-name").value = "";
  document.getElementById("modal-milestone").value = "";
};

/* ---- Drag reorder ---- */
let dragId = null;
document.getElementById("counters").addEventListener("dragstart", e => {
  const card = e.target.closest(".counter-card");
  if (!card) return;
  dragId = card.dataset.id;
  card.classList.add("dragging");
});
document.getElementById("counters").addEventListener("dragend", e => {
  const card = e.target.closest(".counter-card");
  if (card) card.classList.remove("dragging");
});
document.getElementById("counters").addEventListener("dragover", e => {
  e.preventDefault();
  const card = e.target.closest(".counter-card");
  if (!card || card.dataset.id === dragId) return;
  const targetId = card.dataset.id;
  const fromIdx = counters.findIndex(c => c.id === dragId);
  const toIdx = counters.findIndex(c => c.id === targetId);
  if (fromIdx === -1 || toIdx === -1) return;
  const [moved] = counters.splice(fromIdx, 1);
  counters.splice(toIdx, 0, moved);
  persist();
  render();
});

/* ---- Export / Import ---- */
document.getElementById("export-btn").onclick = () => {
  const blob = new Blob([JSON.stringify(counters, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "nexus-counters-backup.json"; a.click();
  URL.revokeObjectURL(url);
  showToast("Backup exported");
};
document.getElementById("import-btn").onclick = () => document.getElementById("import-file").click();
document.getElementById("import-file").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data)) {
        counters = counters.concat(data.map(c => ({...c, id: uid()})));
        persist();
        render();
        showToast("Backup imported");
      }
    } catch { showToast("Invalid backup file"); }
  };
  reader.readAsText(file);
});

/* ---- Voice control ---- */
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
document.getElementById("voice-toggle").onclick = () => {
  if (!SpeechRec) { showToast("Voice not supported on this browser"); return; }
  voiceOn = !voiceOn;
  document.getElementById("voice-toggle").classList.toggle("active", voiceOn);
  document.getElementById("voice-indicator").classList.toggle("on", voiceOn);
  if (voiceOn) startVoice(); else if (recognition) recognition.stop();
};
function startVoice() {
  recognition = new SpeechRec();
  recognition.continuous = true;
  recognition.lang = "en-US";
  recognition.onresult = (e) => {
    const last = e.results[e.results.length - 1][0].transcript.toLowerCase();
    const target = filteredCounters()[0];
    if (!target) return;
    if (last.includes("reset")) { resetCounter(target.id); }
    else if (last.includes("count") || last.includes("plus") || last.includes("add")) { bump(target.id, target.step); }
    else if (last.includes("minus") || last.includes("subtract")) { bump(target.id, -target.step); }
  };
  recognition.onend = () => { if (voiceOn) recognition.start(); };
  recognition.start();
}

/* ---- Shake to count ---- */
let lastShake = 0;
document.getElementById("shake-toggle").onclick = async () => {
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
    const perm = await DeviceMotionEvent.requestPermission();
    if (perm !== "granted") { showToast("Motion permission denied"); return; }
  }
  shakeOn = !shakeOn;
  document.getElementById("shake-toggle").classList.toggle("active", shakeOn);
  showToast(shakeOn ? "Shake to count: ON" : "Shake to count: OFF");
};
window.addEventListener("devicemotion", (e) => {
  if (!shakeOn) return;
  const acc = e.accelerationIncludingGravity;
  if (!acc) return;
  const magnitude = Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z);
  const now = Date.now();
  if (magnitude > 35 && now - lastShake > 800) {
    lastShake = now;
    const target = filteredCounters()[0];
    if (target) bump(target.id, target.step);
  }
});

/* ---- Keyboard shortcuts (desktop) ---- */
window.addEventListener("keydown", e => {
  const target = filteredCounters()[0];
  if (!target) return;
  if (e.key === "+" || e.key === "=") bump(target.id, target.step);
  if (e.key === "-") bump(target.id, -target.step);
});

/* ---- Confetti ---- */
function launchConfetti() {
  const canvas = document.getElementById("confetti-canvas");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext("2d");
  const colors = ["#00e5ff", "#7c3aed", "#ffb020", "#22ff88"];
  let particles = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width,
    y: -20,
    vx: (Math.random() - 0.5) * 6,
    vy: Math.random() * 4 + 2,
    size: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360
  }));
  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.rot += 6;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    });
    frame++;
    if (frame < 90) requestAnimationFrame(animate);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  animate();
}

/* Note: offline caching via service worker requires a separate .js file
   served from the same origin, so it isn't included in this single-file version. */

/* ============ BOOT SEQUENCE ============ */
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById("boot-screen").classList.add("hidden");
  }, 1300);
});

/* ============ PARTICLE BACKGROUND ============ */
(function particleField() {
  const canvas = document.getElementById("particle-canvas");
  const ctx = canvas.getContext("2d");
  let w, h, particles;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function init() {
    resize();
    particles = Array.from({length: 45}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.5 + 0.5
    }));
  }
  function tick() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,229,255,0.5)";
      ctx.fill();
    });
    // connecting lines between close particles
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          ctx.strokeStyle = `rgba(0,229,255,${0.08 * (1 - dist/120)})`;
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener("resize", resize);
  init();
  tick();
})();

/* ============ VOICE COACH (speaks encouragement) ============ */
function speakCoach(text) {
  if (!("speechSynthesis" in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.05;
  utter.pitch = 1.0;
  speechSynthesis.speak(utter);
}
// Hook into milestone celebration
const _origCelebrate = celebrateMilestone;
celebrateMilestone = function(c) {
  _origCelebrate(c);
  const lines = [
    `Nice work. ${c.name} just hit ${c.value}.`,
    `Milestone reached on ${c.name}.`,
    `New record on ${c.name}. Keep going.`
  ];
  speakCoach(lines[Math.floor(Math.random() * lines.length)]);
};

/* ============ CAMERA MOTION AUTO-COUNTER ============ */
let cameraStream = null;
let cameraCount = 0;
let cameraLoopId = null;
let prevFrameData = null;
let lastMotionCountTime = 0;

document.getElementById("camera-toggle").onclick = async () => {
  const modal = document.getElementById("camera-modal");
  modal.classList.add("open");
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    const video = document.getElementById("camera-video");
    video.srcObject = cameraStream;
    cameraCount = 0;
    document.getElementById("camera-count-display").textContent = "0";
    startMotionDetection();
  } catch (err) {
    document.getElementById("camera-status").textContent = "Camera access denied or unavailable.";
  }
};

function startMotionDetection() {
  const video = document.getElementById("camera-video");
  const workCanvas = document.createElement("canvas");
  workCanvas.width = 80; workCanvas.height = 60;
  const wctx = workCanvas.getContext("2d");
  prevFrameData = null;

  function loop() {
    if (!cameraStream) return;
    wctx.drawImage(video, 0, 0, 80, 60);
    const frame = wctx.getImageData(0, 0, 80, 60).data;
    if (prevFrameData) {
      let diffSum = 0;
      for (let i = 0; i < frame.length; i += 4) {
        diffSum += Math.abs(frame[i] - prevFrameData[i]);
      }
      const avgDiff = diffSum / (frame.length / 4);
      const now = Date.now();
      if (avgDiff > 18 && now - lastMotionCountTime > 500) {
        lastMotionCountTime = now;
        cameraCount++;
        document.getElementById("camera-count-display").textContent = cameraCount;
        vibrate(10);
      }
    }
    prevFrameData = frame;
    cameraLoopId = requestAnimationFrame(loop);
  }
  loop();
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  if (cameraLoopId) cancelAnimationFrame(cameraLoopId);
}

document.getElementById("camera-cancel").onclick = () => {
  stopCamera();
  document.getElementById("camera-modal").classList.remove("open");
};

document.getElementById("camera-save").onclick = () => {
  const target = counters[0];
  if (!target) { showToast("Add a counter first"); return; }
  bump(target.id, cameraCount);
  showToast(`Added ${cameraCount} to ${target.name}`);
  stopCamera();
  document.getElementById("camera-modal").classList.remove("open");
};

/* ============ FLOATING WIDGET (Picture-in-Picture) ============ */
document.getElementById("pip-toggle").onclick = async () => {
  const pipVideo = document.getElementById("pip-video");
  const pipCanvas = document.getElementById("pip-canvas");
  const ctx = pipCanvas.getContext("2d");

  if (!document.pictureInPictureEnabled) {
    showToast("Floating widget not supported on this browser");
    return;
  }
  if (document.pictureInPictureElement) {
    await document.exitPictureInPicture();
    return;
  }

  function drawPipFrame() {
    const target = filteredCounters()[0];
    ctx.fillStyle = "#05060a";
    ctx.fillRect(0, 0, 300, 150);
    ctx.strokeStyle = "#00e5ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(4, 4, 292, 142);
    ctx.fillStyle = "#7d8aa0";
    ctx.font = "14px sans-serif";
    ctx.fillText(target ? target.name : "No counter", 16, 30);
    ctx.fillStyle = "#00e5ff";
    ctx.font = "bold 56px monospace";
    ctx.fillText(target ? String(target.value) : "--", 16, 100);
  }

  drawPipFrame();
  const canvasStream = pipCanvas.captureStream(10);
  pipVideo.srcObject = canvasStream;
  await pipVideo.play();

  pipInterval = setInterval(drawPipFrame, 300);
  await pipVideo.requestPictureInPicture();
  document.getElementById("pip-toggle").classList.add("pip-active");

  pipVideo.addEventListener("leavepictureinpicture", () => {
    clearInterval(pipInterval);
    document.getElementById("pip-toggle").classList.remove("pip-active");
  }, { once: true });
};
let pipInterval = null;

render();
</script>
